<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣機車交通週報</title>
<link rel="alternate" type="application/rss+xml" title="台灣機車交通週報 RSS" href="feed.xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
<script>
  (function() {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  :root {
    --bg: #F5F6FA; --card-bg: #fff; --text: #1a1a2e; --text-secondary: #555;
    --text-body: #333; --text-muted: #999; --border: #e0e0e0;
    --accent: #1A3C6E; --accent2: #2980B9;
    --high: #C0392B; --high-bg: #FFF0F0;
    --mid: #D68910;  --mid-bg: #FFFBF0;
    --low: #27AE60;  --low-bg: #F0FFF4;
    --tag-bg: #E8F4FD; --tag-text: #1A5276;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  [data-theme="dark"] {
    --bg: #1a1a2e; --card-bg: #2d2d44; --text: #e8e8f0; --text-secondary: #aaa;
    --text-body: #ccc; --text-muted: #888; --border: #3d3d5c;
    --high-bg: #3d1f1f; --mid-bg: #3d3020; --low-bg: #1f3d25;
    --tag-bg: #2d3a4a; --tag-text: #7ec8e3;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .stat-all { background: #F0F4FF; border-color: #2980B930; }
  .stat-all .num { color: var(--accent2); }
  [data-theme="dark"] .stat-all { background: #1f2d44; }
</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div>
      <h1>🏍️ 台灣機車交通週報</h1>
      <p id="site-subtitle">每週自動彙整台灣機車交通相關新聞，含 AI 摘要與深度分析</p>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button>
      <a class="rss-link" href="https://garyu-ffxiv-news.pages.dev">🎮 FFXIV 新聞</a>
      <a class="rss-link" href="feed.xml">📡 RSS 訂閱</a>
    </div>
  </div>
</header>

<main class="main">
  <div class="search-wrap">
    <input id="search-input" class="search-input" type="search" placeholder="搜尋新聞關鍵字或標籤…">
  </div>
  <div class="week-nav" id="week-nav"></div>
  <div class="tag-bar" id="tag-bar"></div>
  <div class="controls">
    <label>重要性：</label>
    <button class="btn-filter active" data-imp="all">全部</button>
    <button class="btn-filter" data-imp="高">🔴 高</button>
    <button class="btn-filter" data-imp="中">🟡 中</button>
    <button class="btn-filter" data-imp="低">🟢 低</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="article-list"></div>
</main>

<footer class="site-footer">
  由 GitHub Actions + Gemini AI 自動產生 · 每週一更新<br>
  來源：Google News、PTT 機車板、各大新聞網、交通部公告
</footer>

<script>
window.SITE_CONFIG = {
  contentType:  'traffic',
  dismissedKey: 'dismissed-traffic',
  statAllLabel: '📰',
  pageTitle:  weekId => `${weekId} 台灣機車交通週報`,
  subtitle:   (weekId, count, syncLabel) => `${weekId}，共 ${count} 則新聞${syncLabel}`,
  emptyHtml:  '<h3>沒有符合條件的新聞</h3><p>試試調整篩選條件</p>',
  sourceColors: {
    'Google News': '#4285F4', 'PTT/biker': '#FF4500', 'PTT/SuperBike': '#FF4500',
    '聯合新聞網': '#1A3C6E', '中時新聞網': '#C0392B', '自由時報': '#27AE60',
    'TVBS新聞': '#2980B9', 'ETtoday': '#E74C3C', '交通部': '#8E44AD', '公路局': '#7D6608',
  },
  srcColor: s => window.SITE_CONFIG.sourceColors[s] || (s.startsWith('Google News') ? '#4285F4' : '#555'),
  srcLabel: s => s.startsWith('Google News') ? 'Google News' : s,
  sourceLang: {},
  shareToLine: true,
};
</script>
<script src="app.js"></script>
</body>
</html>
