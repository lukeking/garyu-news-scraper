<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garyu FFXIV 週報</title>
<link rel="alternate" type="application/rss+xml" title="Garyu FFXIV 週報 RSS" href="feed.xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
<script>
  (function() {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  :root {
    --bg: #F5F6FA; --card-bg: #fff; --text: #1a1a2e; --text-secondary: #555;
    --text-body: #333; --text-muted: #999; --border: #e0e0e0;
    --accent: #4A235A; --accent2: #8E44AD;
    --high: #C0392B; --high-bg: #FFF0F0;
    --mid: #8B6000;  --mid-bg: #FFFBF0;
    --low: #1A7A43;  --low-bg: #F0FFF4;
    --tag-bg: #F5EEF8; --tag-text: #6C3483;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  [data-theme="dark"] {
    --bg: #1a1a2e; --card-bg: #2d2d44; --text: #e8e8f0; --text-secondary: #aaa;
    --text-body: #ccc; --text-muted: #888; --border: #3d3d5c;
    --accent: #a06db5; --accent2: #c39bd3;
    --high: #FF8080; --mid: #F0A820; --low: #44CC7A;
    --high-bg: #3d1f1f; --mid-bg: #3d3020; --low-bg: #1f3d25;
    --tag-bg: #3a2d44; --tag-text: #c39bd3;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .stat-all { background: #F5EEF8; border-color: #8E44AD30; }
  .stat-all .num { color: var(--accent2); }
  [data-theme="dark"] .stat-all { background: #2d1f3d; }
  .term-pool {
    position: relative;
    border: 2px double var(--accent);
    border-radius: var(--radius);
    padding: 12px 16px 12px;
    margin-bottom: 16px;
    background: var(--tag-bg);
    overflow: hidden;
  }
  .term-pool-header {
    font-size: 0.8rem;
    color: var(--accent2);
    font-weight: 600;
    margin-bottom: 8px;
    user-select: none;
  }
  .term-pool-sub {
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 6px;
    font-size: 0.75rem;
  }
  .term-pool-tags {
    position: relative;
    height: 100px;
  }
  .term-tag {
    position: absolute;
    color: var(--tag-text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    white-space: nowrap;
    cursor: default;
    user-select: none;
  }
</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div>
      <h1>⚔️ Garyu FFXIV 週報</h1>
      <p id="site-subtitle">每週自動彙整 FFXIV 最終幻想 XIV 相關資訊，含 AI 摘要與分析</p>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button>
      <a class="rss-link" href="https://garyu-traffic-news.pages.dev">🏍️ 交通新聞</a>
      <a class="rss-link" href="feed.xml">📡 RSS 訂閱</a>
    </div>
  </div>
</header>

<main class="main">
  <div class="search-wrap">
    <input id="search-input" class="search-input" type="search" placeholder="搜尋 FFXIV 資訊關鍵字或標籤…">
  </div>
  <div class="week-nav" id="week-nav"></div>

  <div id="unknown-term-pool" class="term-pool" style="display:none">
    <div class="term-pool-header">
      ⚔ 未知術語池 <span class="term-pool-sub">Unknown Term Pool</span>
    </div>
    <div class="term-pool-tags" id="term-pool-tags"></div>
  </div>

  <div class="tag-bar" id="tag-bar"></div>
  <div class="controls">
    <label>重要性：</label>
    <button class="btn-filter active" data-imp="all">全部</button>
    <button class="btn-filter" data-imp="高">🔴 高</button>
    <button class="btn-filter" data-imp="中">🟡 中</button>
    <button class="btn-filter" data-imp="低">🟢 低</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="article-list"></div>
</main>

<footer class="site-footer">
  由 GitHub Actions + Gemini AI 自動產生 · 每週一更新<br>
  來源：Lodestone、JP 官方論壇、Reddit r/ffxiv
</footer>

<script>
window.SITE_CONFIG = {
  contentType:  'ffxiv',
  dismissedKey: 'dismissed-ffxiv',
  statAllLabel: '⚔️',
  pageTitle:  weekId => `${weekId} Garyu FFXIV 週報`,
  subtitle:   (weekId, count, syncLabel) => `${weekId}，共 ${count} 則 FFXIV 資訊${syncLabel}`,
  emptyHtml:  '<h3>尚無 FFXIV 資訊</h3><p>請等待下次週報產生，或調整篩選條件</p>',
  sourceColors: {
    'Lodestone': '#6C3483',
    'JP Forum':  '#8E44AD',
    'Reddit':    '#FF4500',
  },
  srcColor: s => window.SITE_CONFIG.sourceColors[s] || (s.includes('Lodestone') ? '#6C3483' : s.includes('Forum') ? '#8E44AD' : '#555'),
  srcLabel: s => s,
  sourceLang: { 'Lodestone': 'JP', 'JP Forum': 'JP', 'Reddit': 'EN', 'Reddit r/ffxiv': 'EN' },
  shareToLine: false,
};
</script>
<script>window.__API_BASE__ = 'https://garyu-news-scraper.lukeking0325.workers.dev/api';</script>
<script src="app.js"></script>
</body>
</html>
