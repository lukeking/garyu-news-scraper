name: Garyu News Scraper 週報

on:
  schedule:
    - cron: '0 0 * * 1'   # 每週一 UTC 00:00 = 台灣 08:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 寫入 config/sources_traffic.yml（從 GitHub Variable）
        run: echo "$SOURCES_TRAFFIC_YML" > config/sources_traffic.yml
        env:
          SOURCES_TRAFFIC_YML: ${{ vars.SOURCES_TRAFFIC_YML }}

      - name: 寫入 config/sources_ffxiv.yml（從 GitHub Variable，選填）
        if: ${{ vars.SOURCES_FFXIV_YML != '' }}
        run: echo "$SOURCES_FFXIV_YML" > config/sources_ffxiv.yml
        env:
          SOURCES_FFXIV_YML: ${{ vars.SOURCES_FFXIV_YML }}

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: Ping Supabase（防免費 tier 閒置暫停）
        run: |
          python - <<'EOF'
          import os, sys
          url = (os.environ.get("SUPABASE_URL") or "").strip()
          key = (os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_KEY") or "").strip()
          if not url or not key:
              print("SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 未設定，跳過 ping")
              sys.exit(0)
          import requests
          resp = requests.get(
              f"{url}/rest/v1/articles?select=id&limit=1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
              timeout=10,
          )
          print(f"Supabase ping status: {resp.status_code}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 執行週報程式（寫入 Supabase）
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 模型 id 非機密：建議在 Repository variables 設定 GEMINI_MODEL_NAME，日誌才不會被 *** 遮罩
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME || secrets.GEMINI_MODEL_NAME }}
          TRAFFIC_SITE_URL: ${{ vars.TRAFFIC_SITE_URL }}
          FFXIV_SITE_URL: ${{ vars.FFXIV_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 寫入 articles 需 service role（略過 RLS）；勿只用 anon key
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 驗證本週資料可由 Supabase 讀取
        run: |
          python - <<'EOF'
          from datetime import datetime, timezone, timedelta
          import os
          import requests
          tw = timezone(timedelta(hours=8))
          y, w, _ = datetime.now(tw).isocalendar()
          week_id = f"{y}-W{w:02d}"
          url = os.environ["SUPABASE_URL"]
          key = (os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_KEY") or "").strip()
          if not key:
              raise RuntimeError("SUPABASE_SERVICE_ROLE_KEY 或 SUPABASE_KEY 未設定")
          resp = requests.get(
              f"{url}/rest/v1/articles?select=week_id&id=not.is.null&week_id=eq.{week_id}&limit=1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
              timeout=15,
          )
          resp.raise_for_status()
          rows = resp.json()
          if not rows:
              raise RuntimeError(f"Supabase 尚未讀到本週資料: {week_id}")
          print(f"Supabase read-after-write OK: {week_id}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 複製共用靜態資源至各站台目錄
        run: |
          cp pages/shared/app.js pages/traffic/app.js
          cp pages/shared/app.js pages/ffxiv/app.js
          cp pages/shared/shared.css pages/traffic/shared.css
          cp pages/shared/shared.css pages/ffxiv/shared.css

      - name: Deploy Traffic Pages to Cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-traffic-news
          directory: pages/traffic

      - name: Deploy FFXIV Pages to Cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-ffxiv-news
          directory: pages/ffxiv