name: 台灣機車交通週報

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 寫入 sources.yml（從 GitHub Variable）
        run: echo "$SOURCES_YML" > sources.yml
        env:
          SOURCES_YML: ${{ vars.SOURCES_YML }}

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行週報程式
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GEMINI_MODEL_NAME: ${{ secrets.GEMINI_MODEL_NAME }}