name: 台灣機車交通週報

on:
  schedule:
    - cron: '0 0 * * 1'   # 每週一 UTC 00:00 = 台灣 08:00
  workflow_dispatch:

permissions:
  contents: read           # 只需要讀程式碼，不需要寫回 repo
  pages: write             # 部署 GitHub Pages
  id-token: write          # OIDC token，GitHub Pages 部署必要

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 寫入 sources.yml（從 GitHub Variable）
        run: echo "$SOURCES_YML" > sources.yml
        env:
          SOURCES_YML: ${{ vars.SOURCES_YML }}

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: Ping Supabase（防免費 tier 閒置暫停）
        run: |
          python - <<'EOF'
          import os, sys
          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              print("SUPABASE_URL / SUPABASE_KEY 未設定，跳過 ping")
              sys.exit(0)
          import requests
          resp = requests.get(
              f"{url}/rest/v1/articles?select=id&limit=1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
              timeout=10,
          )
          print(f"Supabase ping status: {resp.status_code}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 執行週報程式（產生 docs/）
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ secrets.GEMINI_MODEL_NAME }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 安裝 Pagefind 並建立搜尋索引
        run: |
          npm install -g pagefind
          pagefind --site docs --output-path docs/pagefind

      - name: 上傳 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4