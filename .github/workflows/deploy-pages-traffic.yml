name: Deploy Cloudflare Pages (Traffic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/traffic/**"
      - "pages/shared/**"
      - ".github/workflows/deploy-pages-traffic.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 複製共用靜態資源至部署目錄
        run: |
          mkdir -p /tmp/deploy-traffic
          cp -r pages/traffic/. /tmp/deploy-traffic/
          cp pages/shared/app.js /tmp/deploy-traffic/app.js
          cp pages/shared/shared.css /tmp/deploy-traffic/shared.css

      - name: Deploy to Cloudflare Pages (Traffic)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-traffic-news
          directory: /tmp/deploy-traffic
