name: Deploy Cloudflare Pages (Traffic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/traffic/**"
      - "pages/shared/**"
      - ".github/workflows/deploy-pages-traffic.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 準備部署目錄
        run: |
          mkdir -p /tmp/deploy-traffic
          cp -r pages/traffic/. /tmp/deploy-traffic/
          cp pages/shared/app.js /tmp/deploy-traffic/app.js
          cp pages/shared/shared.css /tmp/deploy-traffic/shared.css

      - name: Deploy to Cloudflare Pages (Traffic)
        working-directory: /tmp/deploy-traffic
        run: npx wrangler@latest pages deploy . --project-name=garyu-traffic-news --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
