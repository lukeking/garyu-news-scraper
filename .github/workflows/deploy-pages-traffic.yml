name: Deploy Cloudflare Pages (Traffic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/traffic/**"
      - ".github/workflows/deploy-pages-traffic.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 複製共用靜態資源至各站台目錄
        run: |
          cp pages/shared/app.js pages/traffic/app.js
          cp pages/shared/shared.css pages/traffic/shared.css

      - name: Deploy to Cloudflare Pages (Traffic)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-traffic-news
          directory: pages/traffic
