name: Tests (unit)

# CI gating L0（specs/BACKLOG.md「CI gating」）。
# 只跑 tests/unit：零外部依賴，不需要 config GitHub Variables，也不需要任何憑證。
#
# ⚠️ tests/integration 是「刻意」不在這裡跑的，不是漏掉。
# 那些測試在有 Supabase 憑證時會直接寫進「正式」資料庫（2026-07-21 已實際汙染過一次，
# 16 列測試資料連帶讓 measure_source_uptake.py 的 baseline 偏移）。在 CI 打開它只有兩條爛路：
#   不給憑證 → 測試 skip → 拿到假綠燈；給憑證 → 每個 PR 汙染正式庫。
# 重開條件：等 specs/BACKLOG.md「整合測試指向本機 Supabase」完成後，才加 L2。
#
# 這個 job 也刻意不設 `environment: production` —— 它不該拿得到任何 secret。
#
# JS 單元測試刻意放在**同一個 job** 而不是另開一個：`unit` 是 ruleset 指名的必要檢查
# （見 CLAUDE.local.md），另開 job 會得到一個「跑了但擋不住任何東西」的檢查，
# 而那正是本 repo 一再踩到的「宣告 ≠ 套用」。放這裡它立刻生效，且不必改 ruleset。

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements-dev.txt

      # 註解預算閘（test_comment_budget.py）刻意排除：它對執行期零影響，
      # 擋 merge 買不到對應的東西。執行者改成 .githooks/pre-commit，
      # 判準見 ~/.claude/rules/decision-style.md §三。
      - name: 跑 Python 單元測試
        run: python -m pytest tests/unit -q --ignore=tests/unit/test_comment_budget.py

      - name: 設定 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安裝 JS 相依套件
        run: npm ci

      - name: 跑 JS 單元測試
        run: npm test
