name: Deploy Cloudflare Pages (FFXIV)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/ffxiv/**"
      - "pages/shared/**"
      - ".github/workflows/deploy-pages-ffxiv.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 複製共用靜態資源至部署目錄
        run: |
          mkdir -p /tmp/deploy-ffxiv
          cp -r pages/ffxiv/. /tmp/deploy-ffxiv/
          cp pages/shared/app.js /tmp/deploy-ffxiv/app.js
          cp pages/shared/shared.css /tmp/deploy-ffxiv/shared.css

      - name: Deploy to Cloudflare Pages (FFXIV)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-ffxiv-news
          directory: /tmp/deploy-ffxiv
