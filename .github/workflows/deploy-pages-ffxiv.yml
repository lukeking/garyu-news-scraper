name: Deploy Cloudflare Pages (FFXIV)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/ffxiv/**"
      - ".github/workflows/deploy-pages-ffxiv.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare Pages (FFXIV)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: garyu-ffxiv-news
          directory: pages/ffxiv
