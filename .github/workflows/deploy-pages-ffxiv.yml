name: Deploy Cloudflare Pages (FFXIV)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pages/ffxiv/**"
      - "pages/shared/**"
      - ".github/workflows/deploy-pages-ffxiv.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 準備部署目錄
        run: |
          mkdir -p /tmp/deploy-ffxiv
          cp -r pages/ffxiv/. /tmp/deploy-ffxiv/
          cp pages/shared/app.js /tmp/deploy-ffxiv/app.js
          cp pages/shared/shared.css /tmp/deploy-ffxiv/shared.css
          cp -r functions/ /tmp/deploy-ffxiv/functions/

      - name: Deploy to Cloudflare Pages (FFXIV)
        working-directory: /tmp/deploy-ffxiv
        run: npx wrangler@latest pages deploy . --project-name=garyu-ffxiv-news --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
