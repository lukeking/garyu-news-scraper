name: Deploy Cloudflare Worker API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # v4 預設改裝 wrangler 4；釘在 v3 時期實際用的版本，這次只換 action 的 Node runtime
          wranglerVersion: "3.90.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "workers/api"
          # Define public variables here
          vars: |
            SUPABASE_URL
            SOURCE_UPTAKE_JSON
          # Define encrypted secrets here
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          # These MUST be in the env block so the action can read them
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Per-source noise ratings (spec 011). Not a secret — it is only
          # source names and measured multiples. Absent or malformed leaves
          # every article un-downgraded, so a missing variable is safe.
          SOURCE_UPTAKE_JSON: ${{ vars.SOURCE_UPTAKE_JSON }}
