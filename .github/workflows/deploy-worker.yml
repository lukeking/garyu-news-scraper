name: Deploy Cloudflare Worker API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "3.x" # Note: Wrangler 4.x isn't out yet; 3.x is current major
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "workers/api"
          # Define public variables here
          vars: |
            SUPABASE_URL
          # Define encrypted secrets here
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
          command: deploy --compatibility-flags nodejs_compat
        env:
          # These MUST be in the env block so the action can read them
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
