name: Deploy Cloudflare Worker API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # 釘版本：不釘會跟著上游 major 走（09-21 cloudflare/pages-action 下架同一類風險）。
          # 3.90.0 → 4.144.0 於 09-30 以 `wrangler deploy --dry-run` 比對，bundle 只差排版。
          wranglerVersion: "4.144.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "workers/api"
          # Define public variables here
          vars: |
            SUPABASE_URL
            SOURCE_UPTAKE_JSON
          # Define encrypted secrets here
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          # These MUST be in the env block so the action can read them
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Per-source noise ratings (spec 011). Not a secret — it is only
          # source names and measured multiples. Absent or malformed leaves
          # every article un-downgraded, so a missing variable is safe.
          SOURCE_UPTAKE_JSON: ${{ vars.SOURCE_UPTAKE_JSON }}
