# 不發布的週報（spec 020）：只能手動觸發，不寫入、不發布、不部署。怎麼用與怎麼讀見 docs/dry-run.md。
# 準備步驟、程式步驟的 env 與 job 設定跟 weekly-traffic.yml、weekly-ffxiv.yml、auto-kb.yml 由 tests/unit/test_workflow_parity.py 比對：改那三個檔時這裡要跟著改。
name: Garyu News Scraper 不發布週報

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'dry-input：只到入選，不呼叫生成式 LLM；dry-full：呼叫 LLM，不寫入、不發布'
        required: true
        type: choice
        options:
          - dry-input
          - dry-full
      category:
        description: 'traffic：只跑交通（同 weekly-traffic.yml）；ffxiv：只跑 FFXIV（同 weekly-ffxiv.yml）'
        required: true
        type: choice
        options:
          - traffic
          - ffxiv

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 兩支正式週報裡較大的那個（weekly-ffxiv.yml）：第二級跑的是同一份工作
    environment: production

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 寫入 config/sources_traffic.yml（從 GitHub Variable）
        run: echo "$SOURCES_TRAFFIC_YML" > config/sources_traffic.yml
        env:
          SOURCES_TRAFFIC_YML: ${{ vars.SOURCES_TRAFFIC_YML }}

      - name: 寫入 config/sources_ffxiv.yml（從 GitHub Variable，選填）
        if: ${{ vars.SOURCES_FFXIV_YML != '' }}
        run: echo "$SOURCES_FFXIV_YML" > config/sources_ffxiv.yml
        env:
          SOURCES_FFXIV_YML: ${{ vars.SOURCES_FFXIV_YML }}

      - name: 寫入 config/categories_traffic.yml（從 GitHub Variable）
        run: echo "$CATEGORIES_TRAFFIC_YML" > config/categories_traffic.yml
        env:
          CATEGORIES_TRAFFIC_YML: ${{ vars.CATEGORIES_TRAFFIC_YML }}

      - name: 寫入 config/pipeline_config.yml（從 GitHub Variable）
        run: echo "$PIPELINE_CONFIG_YML" > config/pipeline_config.yml
        env:
          PIPELINE_CONFIG_YML: ${{ vars.PIPELINE_CONFIG_YML }}

      - name: 寫入 config/jieba_userdict.txt（從 GitHub Variable，選填）
        if: ${{ vars.JIEBA_USERDICT_TXT != '' }}
        run: echo "$JIEBA_USERDICT_TXT" > config/jieba_userdict.txt
        env:
          JIEBA_USERDICT_TXT: ${{ vars.JIEBA_USERDICT_TXT }}

      - name: 設定 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # 沒設或空的模式會被程式當成正式模式（src/run_mode.py）。缺少必填輸入的觸發 GitHub 會以 HTTP 422 拒絕（2026-11-16 實測，#229），這裡仍自己擋，不靠平台的行為
      - name: 檢查 level（不是 dry-input、dry-full 就停在這裡）
        run: |
          case "$LEVEL" in
            dry-input|dry-full) echo "level：$LEVEL" ;;
            *) echo "level 的值不認得：「$LEVEL」；認得的值：dry-input、dry-full。空值會被程式當成正式模式，所以不往下跑" >&2; exit 1 ;;
          esac
        env:
          LEVEL: ${{ inputs.level }}

      # 空的類別會被程式當成兩類都跑（src/main.py 的 GARYU_CATEGORY），所以這裡自己擋
      - name: 檢查 category（不是 traffic、ffxiv 就停在這裡）
        run: |
          case "$CATEGORY" in
            traffic|ffxiv) echo "category：$CATEGORY" ;;
            *) echo "category 的值不認得：「$CATEGORY」；認得的值：traffic、ffxiv。空值會被程式當成兩類都跑，所以不往下跑" >&2; exit 1 ;;
          esac
        env:
          CATEGORY: ${{ inputs.category }}

      - name: 計數（開始）
        run: python scripts/dry_run_counts.py take --out "$TRAFFIC_POOL_DIR/counts_before.json"
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          TRAFFIC_POOL_DIR: traffic-pool
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 只用來讀兩個站的最後部署時間（GET），這個 workflow 沒有部署步驟
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 執行週報程式（不發布）
        run: python main.py
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          GARYU_CATEGORY: ${{ inputs.category }}
          TRAFFIC_POOL_DIR: traffic-pool
          ANALYSIS_OUTPUT_DIR: analysis-output
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME || secrets.GEMINI_MODEL_NAME }}
          GEMINI_MODEL_FFXIV: ${{ vars.GEMINI_MODEL_FFXIV }}
          TRAFFIC_SITE_URL: ${{ vars.TRAFFIC_SITE_URL }}
          FFXIV_SITE_URL: ${{ vars.FFXIV_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FFXIV_POOL_DUMP: ffxiv_pool.json

      - name: 週交通熱點分析（不發布）
        if: ${{ inputs.category == 'traffic' }}
        run: python scripts/traffic_weekly_analysis.py
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          TRAFFIC_POOL_DIR: traffic-pool
          ANALYSIS_OUTPUT_DIR: analysis-output
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME || secrets.GEMINI_MODEL_NAME }}
          GEMINI_MODEL_HOT_TOPIC: ${{ vars.GEMINI_MODEL_HOT_TOPIC }}
          GEMINI_MODEL_DIGEST: ${{ vars.GEMINI_MODEL_DIGEST }}
          GEMINI_HOT_TOPIC_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_HOT_TOPIC_MAX_OUTPUT_TOKENS }}
          GEMINI_HOT_TOPIC_TIMEOUT_SECONDS: ${{ vars.GEMINI_HOT_TOPIC_TIMEOUT_SECONDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CATEGORIES_TRAFFIC_YML_PATH: config/categories_traffic.yml
          PIPELINE_CONFIG_YML_PATH: config/pipeline_config.yml
          JIEBA_USERDICT_PATH: config/jieba_userdict.txt
          TRAFFIC_SITE_URL: ${{ vars.TRAFFIC_SITE_URL }}

      - name: 術語收錄（不寫入，只有 ffxiv 的第二級）
        if: ${{ inputs.level == 'dry-full' && inputs.category == 'ffxiv' }}
        run: python scripts/auto_kb.py
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          ANALYSIS_OUTPUT_DIR: analysis-output
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ vars.GEMINI_MODEL_NAME || secrets.GEMINI_MODEL_NAME }}
          GEMINI_MODEL_AUTO_KB: ${{ vars.GEMINI_MODEL_AUTO_KB }}

      # 下面都在前面的步驟失敗時照跑：跑到一半死掉的那一次，最需要知道有沒有寫進任何東西
      - name: 計數（結束）
        if: ${{ !cancelled() }}
        run: python scripts/dry_run_counts.py take --out "$TRAFFIC_POOL_DIR/counts_after.json"
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          TRAFFIC_POOL_DIR: traffic-pool
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 比對前後計數（不同就讓 job 失敗）
        if: ${{ !cancelled() }}
        run: python scripts/dry_run_counts.py compare "$TRAFFIC_POOL_DIR/counts_before.json" "$TRAFFIC_POOL_DIR/counts_after.json"
        env:
          GARYU_RUN_MODE: ${{ inputs.level }}
          TRAFFIC_POOL_DIR: traffic-pool

      - name: 上傳 FFXIV 候選池內容
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-pool
          path: ffxiv_pool.json
          if-no-files-found: warn

      - name: 上傳交通候選清單、選材與兩份計數
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traffic-pool
          path: traffic-pool
          if-no-files-found: warn

      - name: 上傳分析全文與術語收錄的條目
        if: ${{ !cancelled() && inputs.level == 'dry-full' }}
        uses: actions/upload-artifact@v7
        with:
          name: analysis-output
          path: analysis-output
          if-no-files-found: warn
