# sources_traffic.example.yml
# 這是 config/sources_traffic.yml 的格式範例，說明所有支援的欄位與 type。
# 實際使用的設定存放在 GitHub Environment Variable: SOURCES_TRAFFIC_YML
# 請勿把 config/sources_traffic.yml 加入 git（已在 .gitignore 中排除）。
#
# ┌─────────────────────────────────────────────┐
# │  支援的 type                                 │
# │  rss  → feedparser 抓取 RSS / Atom feed      │
# │  ptt  → PTT 看板爬蟲（含 over18 cookie）    │
# │  web  → 一般網頁爬蟲（BeautifulSoup）        │
# └─────────────────────────────────────────────┘

sources:

  # ── type: rss ──────────────────────────────────────────────
  # 必要欄位：name, type, url
  # 選用欄位：enabled（預設 true）

  - name: Google News 機車交通          # 顯示在 log 與信件來源標籤
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+%E4%BA%A4%E9%80%9A&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"
    # 小技巧：Google News RSS 支援 site: 運算子，可鎖定特定媒體
    # 例如只抓聯合新聞網的機車新聞：
    # url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+site:udn.com&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  - name: 聯合新聞網
    type: rss
    enabled: true
    url: "https://udn.com/rssfeed/news/2/0?ch=news"
    # 主流新聞網的 RSS 會用 MOTORCYCLE_KEYWORDS 再次過濾，
    # Google News 的 RSS 因為 query 已鎖定主題，不需要二次過濾。

  - name: 停用的來源範例
    type: rss
    enabled: false                        # ← 只要改成 false 即可停用，不需要刪除整個 block
    url: "https://example.com/rss"

  # ── type: ptt ──────────────────────────────────────────────
  # 必要欄位：name, type, board
  # 選用欄位：enabled（預設 true）、min_pushes（預設 5）

  - name: PTT/biker
    type: ptt
    enabled: true
    board: biker                          # PTT 板名，注意大小寫（biker、SuperBike）
    min_pushes: 5                         # 只收推文數 >= 5 的文章；「爆」自動視為 10

  - name: PTT/SuperBike
    type: ptt
    enabled: true
    board: SuperBike                      # 紅黃牌重機板（S 和 B 要大寫）
    min_pushes: 3                         # 重機板發文較少，可調低門檻

  # ── type: web ──────────────────────────────────────────────
  # 必要欄位：name, type, url
  # 選用欄位：enabled（預設 true）、max_items（預設 10）

  - name: 交通部
    type: web
    enabled: true
    url: "https://www.motc.gov.tw/ch/home.jsp?id=14&parentpath=0,2"
    max_items: 10                         # 最多抓幾筆公告（命中 MOTORCYCLE_KEYWORDS 的連結）

  - name: 公路局
    type: web
    enabled: true
    url: "https://www.thb.gov.tw/sites/ch/modules/news/news_list?Type=2"
    max_items: 10