# sources_traffic.example.yml
# 這是 config/sources_traffic.yml 的格式範例，說明所有支援的欄位與 type。
# 實際使用的設定存放在 GitHub Environment Variable: SOURCES_TRAFFIC_YML
# 請勿把 config/sources_traffic.yml 加入 git（已在 .gitignore 中排除）。
#
# ┌─────────────────────────────────────────────────────────────┐
# │  支援的 type                                                 │
# │  rss     → feedparser 抓取 RSS / Atom feed                  │
# │  ptt     → PTT 看板爬蟲（含 over18 cookie）                 │
# │  web     → 一般網頁爬蟲（BeautifulSoup）                    │
# │  youtube → YouTube 頻道影片（需設定 YOUTUBE_API_KEY）        │
# └─────────────────────────────────────────────────────────────┘

sources:

  # ── type: rss ──────────────────────────────────────────────
  # 必要欄位：name, type, url
  # 選用欄位：enabled（預設 true）
  #          lookback_days（預設 7）— 放寬該來源的新鮮度視窗。
  #          低頻政策來源（道安、基本法…）月發數則，7 天視窗幾乎抓不到；
  #          設 30 可納入近一個月的政策報導，讓 道安政策 bucket 累積足量。

  - name: Google News 機車交通
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+%E4%BA%A4%E9%80%9A&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  # 低頻政策來源範例：用 lookback_days 放寬視窗
  - name: Google News 道安會報
    type: rss
    enabled: true
    lookback_days: 30
    url: "https://news.google.com/rss/search?q=%E9%81%93%E5%AE%89%E6%9C%83%E5%A0%B1&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  - name: Google News 機車事故
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+%E4%BA%8B%E6%95%85&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  - name: Google News 機車法規
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+%E6%B3%95%E8%A6%8F&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  - name: Google News 重機道路
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E9%87%8D%E6%A9%9F+%E9%81%93%E8%B7%AF&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"

  - name: Google News 中央社機車
    type: rss
    enabled: true
    url: "https://news.google.com/rss/search?q=%E6%A9%9F%E8%BB%8A+site:cna.com.tw&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"
    # site: 運算子鎖定中央社（source_weight 0.9），濾掉低品質來源後命中率最高

  - name: 聯合新聞網
    type: rss
    enabled: true
    url: "https://udn.com/rssfeed/news/2/0?ch=news"
    # 主流新聞網的 RSS 會用 MOTORCYCLE_KEYWORDS 再次過濾，
    # Google News 的 RSS 因為 query 已鎖定主題，不需要二次過濾。

  - name: 中央社 政治
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/politics"

  - name: 中央社 國際
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/intworld"

  - name: 中央社 兩岸
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/mainland"

  - name: 中央社 產經
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/finance"

  - name: 中央社 科技
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/technology"

  - name: 中央社 生活
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/lifehealth"

  - name: 中央社 社會
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/social"

  - name: 中央社 地方
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/local"

  - name: 中央社 文化
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/culture"

  - name: 中央社 運動
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/sport"

  - name: 中央社 娛樂
    type: rss
    enabled: true
    url: "https://feeds.feedburner.com/rsscna/stars"

  - name: 停用的來源範例
    type: rss
    enabled: false                        # ← 只要改成 false 即可停用，不需要刪除整個 block
    url: "https://example.com/rss"

  # ── type: ptt ──────────────────────────────────────────────
  # 必要欄位：name, type, board
  # 選用欄位：enabled（預設 true）、min_pushes（預設 5）

  - name: PTT/biker
    type: ptt
    enabled: true
    board: biker                          # PTT 板名，注意大小寫（biker、SuperBike）
    min_pushes: 5                         # 只收推文數 >= 5 的文章；「爆」自動視為 10

  - name: PTT/SuperBike
    type: ptt
    enabled: true
    board: SuperBike                      # 紅黃牌重機板（S 和 B 要大寫）
    min_pushes: 3                         # 重機板發文較少，可調低門檻

  # ── type: web ──────────────────────────────────────────────
  # 必要欄位：name, type, url
  # 選用欄位：enabled（預設 true）、max_items（預設 10）

  - name: 交通部
    type: web
    enabled: true
    url: "https://www.motc.gov.tw/ch/home.jsp?id=14&parentpath=0,2"
    max_items: 10                         # 最多抓幾筆公告（命中 MOTORCYCLE_KEYWORDS 的連結）

  - name: 公路局
    type: web
    enabled: true
    url: "https://www.thb.gov.tw/sites/ch/modules/news/news_list?Type=2"
    max_items: 10

  # ── type: youtube ──────────────────────────────────────────
  # 必要欄位：name, type, channel_id
  # 選用欄位：enabled（預設 true）、max_items（預設 5）、lookback_days（預設 2）
  # channel_id：接受兩種格式：
  #   UC 開頭的頻道 ID（如 UCxxxxxxxxxxxxxxxxxxxxxxxx）
  #   @ 開頭的 handle → 必須加引號（如 "@abcd"）→ 程式自動解析為頻道 ID（多用 1 quota unit）
  #   ⚠️  @ 字元在 YAML 中需要引號，否則會 parse error：channel_id: "@abcd" ✓  @abcd ✗
  #   找法：頻道頁面 URL → youtube.com/channel/UC... 或 youtube.com/@handle
  # 前置條件：需在 GitHub Secrets 設定 YOUTUBE_API_KEY（YouTube Data API v3 金鑰）
  #
  # ⚠️  中文頻道注意：多數中文 YouTube 頻道不提供逐字稿，transcript API 只能拿到標題＋說明。
  #   這種情況下分析深度與 RSS 文章無異，不建議收錄。
  #   建議只啟用有完整逐字稿的頻道（如日文、英文交通分析頻道）。

  - name: 外國交通比較頻道範例
    type: youtube
    enabled: false
    channel_id: UCxxxxxxxxxxxxxxxxxxxxxxxx  # 替換為實際 channel_id（UC 開頭 24 字元）
    max_items: 5
    lookback_days: 2