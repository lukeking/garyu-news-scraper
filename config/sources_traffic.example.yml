# sources_traffic.example.yml
# 這是 prod 來源設定的鏡像：sources 與 SOURCES_TRAFFIC_YML 解析後逐筆相同（順序也算），
# 由 scripts/check_config_drift.py 每天比對。改來源要同步這裡（同一個 PR），否則隔天 daily 會紅。
# 實際使用的設定存放在 GitHub Environment Variable: SOURCES_TRAFFIC_YML
# 本機開發時複製成 config/sources_traffic.yml；請勿把它加入 git（已在 .gitignore 中排除）。
#
# ┌─────────────────────────────────────────────────────────────┐
# │  支援的 type                                                 │
# │  rss     → feedparser 抓取 RSS / Atom feed                  │
# │  ptt     → PTT 看板爬蟲（含 over18 cookie）                 │
# │  web     → 一般網頁爬蟲（BeautifulSoup）                    │
# │  youtube → YouTube 頻道影片（需設定 YOUTUBE_API_KEY）        │
# └─────────────────────────────────────────────────────────────┘
#
# 以下欄位說明是註解，不影響比對。停用來源：改成 enabled: false 即可，不需要刪除整個 block。
#
# ── type: rss ──────────────────────────────────────────────
# 必要欄位：name, type, url
# 選用欄位：enabled（預設 true）
#          lookback_days（預設 7）— 放寬該來源的新鮮度視窗。
#          低頻政策來源（道安、基本法…）月發數則，7 天視窗幾乎抓不到；
#          設 30 可納入近一個月的政策報導，讓 道安政策 bucket 累積足量。
#          同時讓文章跳過 filter 的 14 天 stale 啟發式（收集端已按此視窗把關）。
#          relevance_exempt（預設 false）— 跳過 MUST_INCLUDE 機車關鍵字檢查。
#          政策/深度來源的查詢詞本身就是主題篩選，開會文、民團報告常無
#          機車字眼，不豁免會在 filter 端全滅。
# 非 Google News 的 RSS 會再用 MOTORCYCLE_KEYWORDS 過濾一次；
# Google News 的 RSS 因為 query 已鎖定主題，不做這一層。
#
# ── type: ptt ──────────────────────────────────────────────
# 必要欄位：name, type, board（PTT 板名，注意大小寫：biker、SuperBike）
# 選用欄位：enabled（預設 true）、min_pushes（預設 5；只收推文數 >= 此值的文章，「爆」自動視為 10）
#
# ── type: web ──────────────────────────────────────────────
# 必要欄位：name, type, url
# 選用欄位：enabled（預設 true）、max_items（預設 10；最多抓幾筆命中 MOTORCYCLE_KEYWORDS 的連結）
#
# ── type: youtube ──────────────────────────────────────────
# 必要欄位：name, type, channel_id
# 選用欄位：enabled（預設 true）、max_items（預設 5）、lookback_days（預設 2）
# channel_id：接受兩種格式：
#   UC 開頭的頻道 ID（如 UCxxxxxxxxxxxxxxxxxxxxxxxx）
#   @ 開頭的 handle → 必須加引號（如 "@abcd"）→ 程式自動解析為頻道 ID（多用 1 quota unit）
#   ⚠️  @ 字元在 YAML 中需要引號，否則會 parse error：channel_id: "@abcd" ✓  @abcd ✗
#   找法：頻道頁面 URL → youtube.com/channel/UC... 或 youtube.com/@handle
# 前置條件：需在 GitHub Secrets 設定 YOUTUBE_API_KEY（YouTube Data API v3 金鑰）
#
# ⚠️  中文頻道注意：中文 YouTube 頻道多半用內嵌字幕或不上字幕，很少提供 CC，
#   transcript API 常只能拿到標題＋說明，分析深度與 RSS 文章無異，所以原本不建議收錄。
#   現況：prod 仍啟用 4 個中文頻道；2026-10-15 實測 火花羅、台灣解碼中 取不到逐字稿（退回標題＋說明），
#   貓頭鷹交通書、企鵝交通手扎 取得到。後續見 specs/BACKLOG.md 的 GNS-20261015-0cz。

