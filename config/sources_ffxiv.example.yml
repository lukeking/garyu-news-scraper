# sources_ffxiv.example.yml
# 這是 prod FFXIV 來源設定的鏡像：sources 與 SOURCES_FFXIV_YML 解析後逐筆相同（順序也算），
# 由 scripts/check_config_drift.py 每天比對。改來源要同步這裡（同一個 PR），否則隔天 daily 會紅。
# 實際設定存放在 GitHub Environment Variable: SOURCES_FFXIV_YML
# 本機開發時複製成 config/sources_ffxiv.yml；請勿把它加入 git（已在 .gitignore 中排除）。
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  支援的 type                                                      │
# │  rss        → feedparser RSS/Atom（不做關鍵字二次過濾）           │
# │  html_patch → BeautifulSoup 靜態新聞列表（如 Lodestone）          │
# │  html_forum → vBulletin 討論板標題爬蟲（僅標題+連結）             │
# │  vb_forum   → vBulletin 單一版：窗口內的回覆合成一篇（spec 015）  │
# └──────────────────────────────────────────────────────────────────┘
#
# 每個來源務必設定 content_type: "ffxiv"
# 每個來源設 weight（整數，越大越先入選週報的 20 篇；沒寫＝0、排在最後並印警告）。spec 015。
#
# FFXIV 靜態網站輸出目錄：pages/ffxiv/
# 公開網址（CF Pages 專案 garyu-ffxiv-news）請在 GitHub Environment Variables 設定：
#   FFXIV_SITE_URL=https://garyu-ffxiv-news.pages.dev
# 若未設定，預設值為 https://garyu-ffxiv-news.pages.dev
#
# 以下欄位說明是註解，不影響比對。
#
# ── type: rss ──────────────────────────────────────────────────────────────
# 必要欄位：name, type, url, content_type
# 選用欄位：enabled（預設 true）、weight
#
# ── type: html_patch ───────────────────────────────────────────────────────
# 抓取靜態 HTML 新聞列表，使用 CSS selector 擷取項目
# 必要欄位：name, type, url, content_type, selector
# 選用欄位：title_selector（預設 "a"）、max_items（預設 10）、weight、
#   date_pattern（regex，第一個群組是 UTC epoch 秒；有寫就只收 7 天內的）、
#   exclude_title_prefixes（標題以這些開頭的不收）、
#   detail_selector（有寫就抓每則的詳細頁，取這個節點的文字當內容）、max_chars（詳細頁文字上限，預設 2000）
#
# ── type: html_forum ───────────────────────────────────────────────────────
# 抓取 vBulletin 討論板的帖子列表（僅標題+連結），摘要自動設為 "[JP Forum] {標題}"
# 必要欄位：name, type, url, content_type
# 選用欄位：max_items（預設 15）、weight
#
# ── type: vb_forum ─────────────────────────────────────────────────────────
# 單一版的 RSS（url 要帶 lastpost=1，依最後回覆排序）→ 每串去討論串頁面往前翻，收週窗口內的回覆合成一篇
# 必要欄位：name, type, url, content_type
# 選用欄位：weight、max_pages（預設 3）、max_replies（預設 20）、max_chars（預設 6000）

sources:

  - name: "Reddit r/ffxiv"
    type: rss
    url: "https://www.reddit.com/r/ffxiv/new/.rss"
    enabled: true
    content_type: "ffxiv"
    weight: 20

  - name: "FFXIV Lodestone JP 更新資訊"
    type: html_patch
    url: "https://jp.finalfantasyxiv.com/lodestone/news/category/3"
    enabled: true
    content_type: "ffxiv"
    weight: 60
    selector: "li.news__list"              # 每則新聞的外層容器 CSS selector
    title_selector: "p.news__list--title"  # 標題文字的 CSS selector（找不到時 fallback 到 a）
    max_items: 10
    date_pattern: 'ldst_strftime\((\d{10})'
    exclude_title_prefixes: ["Lodestone", "コンパニオンアプリ"]
    detail_selector: "div.news__detail__wrapper"
    max_chars: 2000

  - name: "FFXIV JP Forum"
    type: html_forum
    url: "https://forum.square-enix.com/ffxiv/forums/512-Japanese-Forums"
    enabled: true
    content_type: "ffxiv"
    weight: 10
    max_items: 15

  # ── 台灣 FFXIV 官網修正說明（已驗證 robots.txt 無限制）─────────────────────
  # www.ffxiv.com.tw/robots.txt 回傳 HTTP 404（無限制），可安全抓取。
  # 2026-10-20 停用：selector 對到導覽列、中文被當成 Latin-1 解碼（BACKLOG GNS-20261020-rhd）。
  - name: "FFXIV TW 修正說明"
    type: html_patch
    url: "https://www.ffxiv.com.tw/web/special/patchnote_log/"
    enabled: false
    content_type: "ffxiv"
    weight: 50
    selector: "li"                 # 需依實際 DOM 結構調整
    title_selector: "a"
    max_items: 10

  # ── JP Forum 各版（type: vb_forum，spec 015）──────────────────────────────

  - name: "FFXIV JP Forum - プロデューサーレターLIVE"
    type: vb_forum
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=537&lastpost=1"
    enabled: true
    content_type: "ffxiv"
    weight: 100
    max_pages: 3
    max_replies: 20
    max_chars: 6000

  - name: "FFXIV JP Forum - TANK"
    type: vb_forum
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=550&lastpost=1"
    enabled: true
    content_type: "ffxiv"
    weight: 80
    max_pages: 3
    max_replies: 20
    max_chars: 6000

  - name: "FFXIV JP Forum - DPS"
    type: vb_forum
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=551&lastpost=1"
    enabled: true
    content_type: "ffxiv"
    weight: 80
    max_pages: 3
    max_replies: 20
    max_chars: 6000

  - name: "FFXIV JP Forum - HEALER"
    type: vb_forum
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=552&lastpost=1"
    enabled: true
    content_type: "ffxiv"
    weight: 80
    max_pages: 3
    max_replies: 20
    max_chars: 6000

  - name: "FFXIV JP Forum - その他バトルシステム"
    type: vb_forum
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=553&lastpost=1"
    enabled: true
    content_type: "ffxiv"
    weight: 80
    max_pages: 3
    max_replies: 20
    max_chars: 6000
