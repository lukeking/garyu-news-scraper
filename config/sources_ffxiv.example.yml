# sources_ffxiv.example.yml
# 這是 prod FFXIV 來源設定的鏡像：sources 與 SOURCES_FFXIV_YML 解析後逐筆相同（順序也算），
# 由 scripts/check_config_drift.py 每天比對。改來源要同步這裡（同一個 PR），否則隔天 daily 會紅。
# 實際設定存放在 GitHub Environment Variable: SOURCES_FFXIV_YML
# 本機開發時複製成 config/sources_ffxiv.yml；請勿把它加入 git（已在 .gitignore 中排除）。
#
# ┌──────────────────────────────────────────────────────────────────┐
# │  支援的 type                                                      │
# │  rss        → feedparser RSS/Atom（不做關鍵字二次過濾）           │
# │  html_patch → BeautifulSoup 靜態新聞列表（如 Lodestone）          │
# │  html_forum → vBulletin 討論板標題爬蟲（僅標題+連結，不抓內文）   │
# └──────────────────────────────────────────────────────────────────┘
#
# 每個來源務必設定 content_type: "ffxiv"
#
# FFXIV 靜態網站輸出目錄：pages/ffxiv/
# 公開網址（CF Pages 專案 garyu-ffxiv-news）請在 GitHub Environment Variables 設定：
#   FFXIV_SITE_URL=https://garyu-ffxiv-news.pages.dev
# 若未設定，預設值為 https://garyu-ffxiv-news.pages.dev
#
# 以下欄位說明是註解，不影響比對。
#
# ── type: rss ──────────────────────────────────────────────────────────────
# 必要欄位：name, type, url, content_type
# 選用欄位：enabled（預設 true）
#
# ── type: html_patch ───────────────────────────────────────────────────────
# 抓取靜態 HTML 新聞列表，使用 CSS selector 擷取項目
# 必要欄位：name, type, url, content_type, selector
# 選用欄位：title_selector（預設 "a"）、max_items（預設 10）
#
# ── type: html_forum ───────────────────────────────────────────────────────
# 抓取 vBulletin 討論板的帖子列表（僅標題+連結）
# 完整內文需登入，因此摘要自動設為 "[JP Forum] {標題}"
# 必要欄位：name, type, url, content_type
# 選用欄位：max_items（預設 15）

sources:

  - name: "Reddit r/ffxiv"
    type: rss
    url: "https://www.reddit.com/r/ffxiv/new/.rss"
    enabled: true
    content_type: "ffxiv"

  - name: "FFXIV Lodestone JP 更新資訊"
    type: html_patch
    url: "https://jp.finalfantasyxiv.com/lodestone/news/category/2"
    enabled: true
    content_type: "ffxiv"
    selector: "li.news__list--topics"      # 每則新聞的外層容器 CSS selector
    title_selector: "p.news__list--title"  # 標題文字的 CSS selector（找不到時 fallback 到 a）
    max_items: 10

  - name: "FFXIV JP Forum"
    type: html_forum
    url: "https://forum.square-enix.com/ffxiv/forums/512-Japanese-Forums"
    enabled: true
    content_type: "ffxiv"
    max_items: 15

  # ── 台灣 FFXIV 官網修正說明（已驗證 robots.txt 無限制）─────────────────────
  # www.ffxiv.com.tw/robots.txt 回傳 HTTP 404（無限制），可安全抓取。
  - name: "FFXIV TW 修正說明"
    type: html_patch
    url: "https://www.ffxiv.com.tw/web/special/patchnote_log/"
    enabled: true
    content_type: "ffxiv"
    selector: "li"                 # 需依實際 DOM 結構調整
    title_selector: "a"
    max_items: 10

  # ── JP Forum 各版的 RSS（type: rss）──────────────────────────────────────

  - name: "FFXIV JP Forum - プロデューサーレターLIVE"
    type: rss
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=537"
    enabled: true
    content_type: "ffxiv"

  - name: "FFXIV JP Forum - TANK"
    type: rss
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=550"
    enabled: true
    content_type: "ffxiv"

  - name: "FFXIV JP Forum - DPS"
    type: rss
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=551"
    enabled: true
    content_type: "ffxiv"

  - name: "FFXIV JP Forum - HEALER"
    type: rss
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=552"
    enabled: true
    content_type: "ffxiv"

  # 下一筆與上一筆同名、forumids 不同（552／553）：prod 就是這樣，鏡像照抄。
  # 要改名，SOURCES_FFXIV_YML 與這裡要一起改，只改一邊隔天 daily 會紅。
  - name: "FFXIV JP Forum - HEALER"
    type: rss
    url: "https://forum.square-enix.com/ffxiv/external.php?type=RSS2&forumids=553"
    enabled: true
    content_type: "ffxiv"
