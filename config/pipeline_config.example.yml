# Traffic Pipeline Configuration
# Stored as GitHub Environment Variable: PIPELINE_CONFIG_YML
# Copy to config/pipeline_config.yml for local development (gitignored).
#
# All thresholds are configurable here — no code changes required for tuning.

jaccard:
  merge_threshold: 0.45      # Traffic: Jaccard > this → deduplicate (keep higher word count)
  cluster_lower: 0.20        # Traffic: 0.20–0.45 → cluster into same topic bucket
  game_threshold: 0.50       # Game (FFXIV): Jaccard > this → discard as duplicate

topic_scoring:
  min_threshold: 1.5         # Cumulative score must meet/exceed this to qualify as hot topic
  max_hot_topics: 3          # Maximum hot-topic reports generated per weekly run
  novelty_growth_pct: 0.5    # Novelty gate: re-report only if score ≥ last_reported × (1 + this)
  category_min_threshold:    # Per-category override of min_threshold (falls back to min_threshold).
                             # Lets low-cadence categories surface despite small buckets; novelty
                             # gate and max_hot_topics still apply on top.
    道安政策: 1.0            # Policy news is sparse & topically diverse; best bucket ~1.4 < 1.5

topic_identity:
  similarity_threshold: 0.3  # Same-topic match: Jaccard of representative tokens ≥ this (within same category)

buffer:
  max_age_weeks: 8           # Articles older than this are expired from the buffer
  max_daily_articles: 100    # Safety ceiling on articles buffered per daily run (dedup runs first).
                             # Generative cost is bounded at the weekly stage (min_threshold + max_hot_topics
                             # + novelty gate), so this only guards against a feed-flood anomaly.

# Category digest (feature 010) — aggregation path for event-diverse, low-cadence
# categories whose articles never cluster (all singletons, score ceiling ~0.22).
# When a listed category accumulates enough effective articles in the buffer, one
# multi-event digest report ("<category> · 彙整") is published and the whole pool
# is consumed (marked analyzed). Empty/missing = feature off. Sub-keys optional.
category_digest:
  道安政策:
    trigger_count: 10        # Effective-article count that fires a digest (~every 2-3 weeks at 3-4/wk inflow)
    quality_floor: 0.18      # Articles below this quality neither count nor get selected
                             # (known junk "友善列印" = 0.165; weakest real article = 0.193)
    max_articles: 15         # Max articles fed into the digest prompt (quality desc)

embed_dedup:
  threshold: 0.88            # Cosine similarity ≥ this → same event (Gemini Embedding 2, 768d)

quality_score_weights:       # Must sum to 1.0
  keyword_match_ratio: 0.4
  normalised_word_count: 0.3
  source_weight: 0.3

source_weights:              # Credibility weight per outlet (0.0–1.0); default 0.5 for unlisted
  中央社: 0.9
  聯合新聞網: 0.85

# Brand keywords — any article whose source contains one of these
# is dropped at filter time, even if it arrived via an aggregator feed.
# Example: ["太報", "TaiSounds", "某媒體"]
blocked_sources:
  - "三立"
  - "自由時報"
  - "ETtoday"
  - "東森"
  - "太報"
  - "TaiSounds"

blocked_content_keywords:
  - "汽機車"      # ← catches the Yahoo section tag in titles
  - "優惠"
  - "上市"
  - "售價"
  - "試駕"
  - "銷售排行"
  - "開學季"
  - "推薦"
  - "車展"
  - "重機展"
  - "車聚"
  - "代言"
