# Traffic News Category Taxonomy
# Stored as GitHub Environment Variable: CATEGORIES_TRAFFIC_YML
# Copy to config/categories_traffic.yml for local development (gitignored).
#
# Rules:
#   - Categories are matched in definition order; first match wins.
#   - Keywords are matched case-insensitively against the normalised article title.
#   - Articles matching no category receive major_category = 'uncategorised'.
#   - Add new categories here without any code changes.

categories:
  # ── Layer 2.5 深度／政策分類（置於事故分類之前，框架優先）──────────
  # 用具體複合詞避免吃掉事故簿標題；目的是讓深度/政策來源聚成 bucket、
  # 突破 min_threshold，而非散成 uncategorised 單篇。
  # 關鍵字必須是 jieba 會切出的 token（assign_category 用 token 交集比對，
  # 複合詞如「區間測速」會被切成「區間」「測速」而無法整詞命中）。
  科技執法:
    keywords: [測速, 執法, 檢舉]
  路權政策:
    keywords: [路權, 還路, 禁行, 兩段]
  交通工程:
    keywords: [工程, 庇護島, 人因]
  道安政策:
    keywords: [道安, 道安會, 願景]

  大型車安全:
    keywords: [大型車, 聯結車, 貨車, 視野死角, 盲區, 砂石車, 重型車, 大貨車]
  酒駕:
    keywords: [酒駕, 酒後駕車, 酒測, 吹氣, 藥駕, 酒後]
  道路施工:
    keywords: [施工, 道路工程, 封閉, 改道, 挖掘, 鋪路, 路面]
  行人事故:
    keywords: [行人, 斑馬線, 人行道, 行穿線, 路人]
  路口安全:
    keywords: [路口, 號誌, 闖紅燈, 轉彎, 交叉路口]
  機車事故:
    keywords: [機車, 摩托車, 騎士, 重機, 白牌, 紅牌, 機車事故]

# Source-default fallback (optional):
#   When title-token assignment yields 'uncategorised', the article's source is
#   matched (substring) against these keys; first match wins and sets the
#   major_category. Only applied as a fallback — never overrides a title hit.
#   Lets low-frequency deep sources (whose editorial titles carry no category
#   token) aggregate into a policy bucket instead of scattering as singletons.
source_defaults:
  報導者: 道安政策
  天下: 道安政策
  道安統計: 道安政策
  道安會報: 道安政策
  交通安全基本法: 道安政策
  Vision Zero: 道安政策
  行人地獄: 行人事故
  區間測速: 科技執法
  # 政策類擴充（2026-07-20）：無關鍵字命中的標題由此接住；
  # 禁行/兩段/行人 已是 taxonomy 關鍵字且排在事故類之前，會自行正確落位。
  交通安全教育: 道安政策
  # 處罰條例 已移除（2026-07-27）。這個 feed 回來的是「提到罰則的事故簿」，
  # 標題沒有分類關鍵字，於是全被這條 fallback 抬進政策池。07-27 週報實測：
  # 4 篇經此進池、4 篇離題（通緝犯落網、二手菸強制罪、對撞吞罰單、酒駕裁罰），
  # 其中 2 篇被選進已發布的「道安政策 · 彙整」。同期其餘政策 feed 的
  # source_default 精確度為 交通安全教育 ~95%、道安會報 ~80%、Vision Zero 100%，
  # 只有這個是 0%——問題在 feed 精確度，不在 fallback 機制本身。
  # 重開條件：該 feed 改用更限定的 query（例如加上「修法」「草案」）後重測精確度。

# Relevance gate (feature 012) — applied at WEEKLY hot-topic selection, before clustering.
#   Whitelist-dominant substring match (see specs/012.../data-model.md §1):
#   - require_any present → on-topic iff the (cleaned, lower-cased) title CONTAINS any
#     require token as a substring. exclude_any is then INERT — the 肇事逃逸/傷亡型 boundary
#     is kept precisely because a require token (肇事/撞/死…) hits.
#   - exclude_any only (no require_any) → pure blacklist: off-topic iff a token hits.
#   - category absent here → NOT gated (all pass). Malformed rule → fail-open (not gated).
#   Tokens are substrings, NOT jieba tokens — so single-char accident signals (撞/傷/亡/死)
#   work (token intersection dropped them and mis-glued 撞死/涉竊; see the §1 replay).
relevance_rules:
  機車事故:
    # 白名單：真事故訊號。機車 桶必須自證是事故；純刑案（涉竊/毒駕羈押，無事故 token）與
    # 行銷稿（油耗/市佔/銷量，無事故 token）因命不中 require 而落選。市場詞另由
    # pipeline_config.yml 的 blocked_content_keywords（Tier 1，filter 階段）攔。
    #
    # T012 定案（2026-08-08）：對 87 列人工基準集消融調出，達 SC-003（離題 0%）／
    # SC-004 L0（損失 4/16＝25%，全部可歸因）。跑
    # `scripts/measure_relevance.py --ablate` 可重現下列每一項理由：
    #   · 移除 車禍 —— 獨撐 on＝0（它抓到的 7 篇 on 全有別的 token 也抓到），卻獨力製造
    #     2 個 false positive：「車禍線上律師」是頻道名、「險釀車禍」是險象。純負債。
    #   · 移除 追撞/自撞/擦撞 —— 可證明的冗餘：撞 是三者的子字串，不可能有它們抓到
    #     而 撞 抓不到的標題。移除不影響任何判定。
    #   · 傷 → 受傷/重傷/輕傷/傷亡/擦傷/無傷 —— 單字 傷 同時在接住真傷者與誤接
    #     「刺傷」「砸傷」（傷害案，非交通事故）。**無傷 必須留著**：標題會寫「幸運無傷」
    #     正是因為事故發生了，它是有效的事故訊號；漏掉它會讓 06-08 那個零離題的桶
    #     從 3 篇掉到 2 篇、分數 2.58→1.36 跌破門檻，整桶陪葬（實測 on-topic 16→9）。
    #   · 新增 摔/碾/壓/火海 —— 補回 3 篇被漏抓的真事故（摔落遭公車壓住／碾壓魂斷／
    #     電動機車瞬陷火海）。
    # 已知殘餘（非本階段可解，勿硬湊）：
    #   · 「3米路樹突倒機車道」標題零事故語彙，純子字串規則抓不到。
    #   · 「毒蟲駕車撞BMW波及10餘輛機車」真有碰撞故 撞 必留，但人工判定為離題
    #     （重點在毒品）。這是 spec 所述「LLM 重開條件」的語意型殘餘。
    #
    # 第二輪（2026-08-31，BACKLOG #10）：補近失詞。起因是 012 上 prod 後排除率
    # 208/327＝63.6%（比 87 列基準集上更激進），而被排除的那批裡有真事故。
    # 兩側各用一個獨立靶量，因為它們的母體不同：
    #   · recall 側＝08-10 週報 log 的 220 筆 [off-topic] 逐筆紀錄（run 31345438480）。
    #     那批文章已隨 buffer 汰除、不在 DB 裡，log 是唯一還在的物證。
    #   · FP 側＝DB 全表 1572 筆不重複標題（全類別，含未被路由進本桶者＝上界）。
    # 收下列 8 個，每個都獨力救回至少一篇（見 tests/unit/test_relevance_token_table.py）：
    #   · 輾 —— 同義異形字。表裡原有 碾，但台灣媒體慣用 輾，是不同字，碾 抓不到 輾。
    #     救回「騎士遭輾」「遭垃圾車輾斃」2 篇。
    #   · 擊落 —— 台灣車媒指「被撞飛」不是軍事。除了 08-10 那篇，DB 裡另有 4 篇真事故
    #     （車門殺擊落／黑狗竄出擊落／電線勒頸擊落），是本輪 recall 最高的一個。
    #   · 魂斷 / 奪命 / 命危 —— 各救回 1 篇，語彙專一。
    #   · 生命跡象 / 無心跳 / 沖走 —— 各救回 1 篇；DB 全表 FP 皆為 0。
    # ⚠️ 刻意不收的 4 個，理由寫在這裡以免下一輪又被「順手加回來」：
    #   · 車禍 —— 見上方 T012 那段。那個決策仍然成立，本輪未動。
    #   · 墜 —— 「中和派出所旁女子墜樓送醫」確實被路由進本桶（該篇現靠 送醫 進來），
    #     所以裸 墜 會放 墜樓 進來。它本來要救的那篇同時有 生命跡象，改收後者。
    #   · 捲入 —— 通用義強（捲入弊案／風波）。它要救的那篇同時有 無心跳，改收後者。
    #   · 搶救 —— 通用義強（搶救文物／少子化）。與 命危 同一篇，冗餘。
    # 已知殘餘（量到了、刻意不解，勿硬湊）：
    #   · 「衝坡輾草皮」被 輾 命中且非事故。它目前落在**其他類別**，閘看不到；
    #     若日後路由改變它就會變成真的 FP。這是 1572 筆裡唯一一個。
    #   · 「神反應翻過引擎蓋落地」仍抓不到。唯一能救它的 翻過 通用義過強
    #     （翻過去／翻過一頁），且該篇無人傷亡＝近失非事故。已寫成測試斷言。
    require_any:
      [撞, 事故, 肇事, 送醫, 不治,
       受傷, 重傷, 輕傷, 傷亡, 擦傷, 無傷,
       亡, 死, 翻車, 失控,
       摔, 碾, 輾, 壓, 火海,
       魂斷, 奪命, 命危, 生命跡象, 無心跳, 沖走, 擊落]
